# Settings for bake_floors.py
# [default] applies to every material; a table named after a material
# (the part of the zip name before the first "_") overrides it.

[default]
repeats = 1              # texture repeats across the output image
target_value = 118       # mean brightness, 0-255 (theme mid-tone)
target_contrast = 16     # brightness spread; lower = calmer floor
tint = [122, 113, 98]    # theme palette colour
tint_amount = 0.55       # 0 = texture's own colour, 1 = fully palette
relief = 0.75            # overall strength of all shading
normal_strength = 2.0    # lamp shading from the normal map
edge_strength = 0.35     # ridges lighter, creases darker
light_height = 2.0       # lamp height above the image centre, in image widths; lower = stronger
falloff = 0.0            # darkening towards the image edges; 0 = off
cavity_strength = 1.0    # grime in lows, wear on highs (displacement)
ao_strength = 0.6        # AO map, or AO derived from displacement
emissive_strength = 0.5  # lights from emissive maps; 0 = off
glow = 0.5               # halo around lights; 0 = none
transparent = true       # Opacity map -> transparent PNG; false = solid
# Grid grooves are a command-line option: --grid 640

# Example override:
# [Asphalt019]
# target_contrast = 12

# 8x8 paving stones; cut 2 stones per grid square instead of stretching all 8
[Tiles085]
